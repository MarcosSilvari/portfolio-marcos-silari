<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="FRONTEND/CSS/imc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header>
        <h1>PORTFÓLIO SILVARI</h1> <!-- título do portfólio -->
        <nav>
            <ul><!-- menu de navegação -->
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <a href="#">Projetos ▾</a>
                        <ul class="submenu">
                            <li><a href="list.html">Lista de tarefa</a></li>
                            <li><a href="imc.html">Calculadora de IMC</a></li>
                        </ul>
                </li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="login.html"><button>Entrar</button></a></li>
            </ul>
        </nav>
    </header>
    <main id="container">
        <section id="img">
            <img src="Assests/undraw_healthy-habit_2ata (2).svg" alt="">
        </section>
        <section id="calcular">
            <form id="form">
                <h1>CALCULADORA DE IMC</h1>

                <div class="input-box">
                    <label for="weight">
                        Peso em kg
                    </label>

                    <div class="input-field">
                        <i class="fa-solid fa-weight-hanging"></i>
                        <input type="number" id="weight" required step="0.01">
                        <span>
                            kg
                        </span>
                    </div>
                </div>

                 <div class="input-box">
                    <label for="alto">
                        Altura em Metros
                    </label>

                    <div class="input-field">
                        <i class="fa-duotone fa-solid fa-ruler"></i>
                        <input type="number" id="alto" required step="0.01">
                        <span>
                            M
                        </span>
                    </div>
                </div>

                <button class="calcular">
                    Calcular
                </button>
            </form>

            <div id="info">
                <div id="resultado">
                    <div id="imc">
                        <span id="values"></span>
                        <span>Seu IMC</span>
                    </div>
                    <div id="descricao">
                        <span id="descricao-texto"></span>
                    </div>
                </div>
                <div id="mais-info">
                    <a href="https://www.tuasaude.com/imc/">Para mais informações sobre IMC</a>
                    <i class="fa-solid fa-link"></i>
                </div>
            </div>
        </section>
    </main>

    <script src="FRONTEND/JS/imc.js"></script>
</body>

</html>
