<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="FRONTEND/CSS/cadastro.css">
</head>
<body>

  <aside class="brand">
    <div class="brand-mark">marcos<span>.</span>dev</div>
    <div class="brand-copy">
      <h1>Crie sua conta</h1>
      <p>Cadastre um e-mail e uma senha para começar a usar o painel.</p>
    </div>
    <div class="brand-foot">Projeto 2 &middot; sistema de login</div>
  </aside>

  <main class="form-side">
    <div class="form-wrap">
      <h2>Cadastrar</h2>
      <p class="sub">Leva menos de um minuto.</p>

      <form id="cadastro-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="voce@email.com" autocomplete="email">
          <div class="field-msg">Informe um e-mail válido.</div>
        </div>

        <div class="field" id="field-senha">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="mínimo 6 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-pass" id="toggle-pass">mostrar</button>
          <div class="field-msg">A senha precisa ter pelo menos 6 caracteres.</div>
        </div>

        <button class="btn-primary" type="submit" id="submit-btn">
          <span class="btn-text">Criar conta</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="signup">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script src="FRONTEND/JS/cadastro.js"></script>
</body>
</html>
